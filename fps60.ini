; fps60 - 60fps mod for FFX HD (docs/PLAN.md Wave 4). Read once at game start.
; Never deploy next to FRAMEDIFF (same dbghelp.dll name). Works alongside Fahrenheit (Sg_MainLoop hook chained).
[fps60]
; soft reset to the title screen: hold these buttons together (field only, not in battle); 0 = off
; buttons: L1 L2 R1 R2 L3 R3 START SELECT TRIANGLE CIRCLE CROSS SQUARE UP DOWN LEFT RIGHT, joined by +
soft_reset=L1+L2+R1+R2+START+SELECT

enabled=1
; 1 = the mod's pacing (divider held at 1, exec alternates); 0 = stock 30 Hz pacing
pacing=1
; drawn frames per second: any multiple of 30 from 60 to 240 (60, 90, 120, 150, 180, 210, 240). The game's
; logic always runs at its original 29.97 Hz; this says how many frames are drawn per logic tick (fps / 30).
; The in-between rates matter: a PC that draws 200 fps holds 180 but not 240. Above 60 the game must present
; without V-Sync (its own Config page), or the swap chain holds the loop at the monitor's refresh rate; the
; host frame limiter is retargeted by row RATE-001, and PERF-002 steps the rate down one notch at a time when
; the PC cannot hold it.
fps=60
; master switch for the rollback engine (Hybrid default mitigation)
rollback=1
; skip-render backlog invocations: logic = exec 1, phase unchanged; toggle = alternate like others
alt_backlog=logic
; setter = Sg_SetExecFrames (engine's own clamp); byte = write the exec byte directly
exec_method=setter
; seconds to wait for the Steam DRM to unpack .text before giving up (nothing installed)
unpack_timeout_s=60
; log divider requests and pacing transitions (rate-limited)
log_pacing_events=1
; diagnostic: 1 = the game's crash dump (CoreDump.dmp) also holds heap and module data (large file)
crash_dump_mem=0

[rows]
; one key per ledger-row mitigation: ROW_ID=1 on, 0 off (missing = the row's default).
; host frame limiter retargeted to [fps60] fps x 29.97 Hz; 0 = the game's own 59.94 Hz, which caps the mod at 60
RATE-001=1
; summon/overlay update + OPU pass 0 skipped on render-only frames (RC2)
MAG-008=1
; FMV playback: hold stock 30 Hz pacing while a movie plays (video/audio sync)
W2A-002=1
; W2A-002-MODE 2 = stay 60 Hz and advance a playing movie once per logic tick (scenes with characters over a movie stay 60),
; 1 = stock 30 Hz pacing while a movie plays
W2A-002-MODE=2
; map/BG keyframe animations (animated lights, BG objects) clock at stock speed, smooth at 60 Hz
CLK-002=1
; in-game cutscenes synced to a wall-clock timeline (SyncData, voiced scenes): hold stock 30 Hz pacing while one runs
; (voice sync). Off by default: set CLK-013=1 if a voiced cutscene drifts out of sync (e.g. before Yunalesca).
; CLK-013-HOLD=0 only logs the scene start/end; CLK-013-DIAG=1 logs entries fetched per invocation kind
CLK-013=0
CLK-013-HOLD=1
CLK-013-DIAG=0
; particle programs: pause flag + no spawn on render-only frames, draw still runs (RC3)
MAG-006=1
; MAG-006 sub-switch: also skip particle spawn on render-only frames (crashed together with MAG-006 on 10/10)
MAG-006-SPAWN=0
; diagnostic: DLL particle programs step unpaused on render-only frames (2x); crash bisect only
MAG-006-UNPAUSE=0
; MAG-006 sub-switch: 1 (default) = a DLL program that never advanced steps unpaused (magic_0102 crash)
MAG-006-FRESH=1
; magic DLLs read a logic-rate frame counter (summon/spell timers, spawn cadence)
MAG-009=1
; exec==0 camera fallback (spherical camera + battle camera ease) suppressed on render-only frames (2x camera)
LOOP-005=1
; viewport camera tween/shake blocks + battle RNG stream 9 rolled back on render-only frames (2x camera tween/shake)
LOOP-004=1
; W/V magic overlays: PPP record clocks (start delay, age, callbacks, SE timeline) held on render-only frames
MAG-016=1
; MAG-016 sub-switch: apply the hold (0 = hook installed, records run per render as before; U 10/10: 1 fixes the Ifrit summon). F10 toggles it in game.
MAG-016-HOLD=1
; MAG-016 sub-switch: per-invocation log of magic_0304 rec0 age/delay/y, fall velocity, slot +0x358 argument
MAG-016-DIAG=0
; magic_0305 (Meteor Strike) draw node: render-only frames draw records only (move script + SE countdowns held)
MAG-017=1
; family-E magic DLLs: stale (exec==0) pause cache + particle pause flag reset at logic frames (Ixion soft-lock with MAG-008)
MAG-018=1
; a family-E DLL that unloads with the particle pause flag at 1 has it reset at the next logic frame (Thundaga then
; Life on a KO'd ally soft-locked: every particle program stayed frozen)
MAG-018-UNLOAD=1
; VFX shader setup FUN_006a48d0: skip when the material name is null (paused-draw crash strstr(NULL), Thunder/Thundara)
MAG-019=1
; family-X effect node walk (FUN_00925440, 40 DLLs): render-only frames draw nodes only (Bad Breath soft-lock)
MAG-020=1
; family-E magic DLLs: render-only frames replay the DLL update + draw unpaused, then restore its .data (Energy Ray / Thor's Hammer blink)
MAG-021=1
; MAG-021-SKIP: magic DLL numbers (comma-separated) never replayed; empty = replay all. 0573 = Braska's Final Aeon grab
; (the replay builds the held character from the DLL's next-step matrices: drawn beside the hand)
MAG-021-SKIP=0573
; magic_0605 (Hellfire) rock node: render-only frames draw without stepping; embers node skipped (MAG-022-EMBERS)
MAG-022=1
MAG-022-EMBERS=1
MAG-022-TARGETS=1
; magic-DLL actor motion/throw script (118 DLLs, e.g. grenade magic_0242) steps only on logic invocations
MAG-023=1
; thrown-item arc node (grenade magic_0242 + 0651/0654/0655/0657) steps only on logic invocations
MAG-024=1
; battle effect-unit scripts (EXE pass-1 walk, magic-DLL draws) step once per logic tick: WAIT countdowns held on render-only
; frames, per-frame draw/poll loops still run (Mental Break wind-up released 3 ticks early; battle-entry shatter)
MAG-025=1
; MAG-025 modes per walk source: 1 = skip every stream step (blinks effects that draw from their script), 2 = hold WAIT only,
; 3 = hold WAIT and run a WAIT-0 stream only if it repeated on the last logic tick; 0 = untouched
MAG-025-MODE=3
MAG-025-DLLMODE=3
; MAG-025 sub-switch: hold effect-unit position integration on render-only frames
MAG-025-POS=1
; MAG-025: opcodes that never run on render-only frames (hex): 1F loop counter, 7F battle signal
MAG-025-DENY=1F,7F
; family-X effect records (Vorban's Mortar): render-only draws do not step particle programs, motion or animation (needs MAG-020)
MAG-026=1
; MAG-026 sub-switches: pause the record particle program step (needs MAG-006) / restore record fields after the draw
MAG-026-PPP=1
MAG-026-REC=1
; magic-DLL event timeline (magic_0539 and 21 more): events start only on logic invocations (double-start crash at 0x712010)
MAG-027=1
; particle pause flag back to the game's own value at each logic frame while magic DLLs are involved (a spell that
; ends on a render-only frame left every particle frozen: Death then Life soft-locked)
MAG-028=1
; screen fades (incl. lightning flash, battle transition fades) step once per logic tick; render-only frames draw with state restored
UI-001=1
; UI-001 sub-switch (60 Hz promotion): render-only frames draw the fade half step (smoother; 0 = hold at the logic-tick state)
UI-001-HALF=0
; gameplay pad latch only on logic invocations (K4): presses are not lost on render-only frames
UI-017=1
; Sphere Grid update (stick cursor speed, d-pad repeat in lists) only on logic ticks
UI-SPH-001=1
; Sphere Grid particles (node activation effects) paused on render-only frames (needs MAG-006)
UI-SPH-002=1
; minimap player-arrow pulse at stock speed (the draw still runs every frame)
UI-014=1
; battle party swap (L1): presses that land on a render-only frame are not lost
UI-BTLL1=1
; character texture animation (UV scroll/flipbook, e.g. the water on Brotherhood) steps once per logic tick
TEXANIM-001=1
; test tool: hold DEV-TURBO-KEY to run the game DEV-TURBO-SPEED times faster (game turbo/backlog path; 2..30)
; the game turns the frame delta into a whole number of backlog ticks, so above 60 fps the shorter delta rounds
; the factor down (x10 reaches about x8 at 240): raise DEV-TURBO-SPEED there if the exact factor matters
; key = Windows virtual-key code in decimal: 96 numpad 0, 97 numpad 1, 192 backquote, 112 F1 ...
DEV-TURBO=1
DEV-TURBO-KEY=96
DEV-TURBO-SPEED=10
; test tool: DEV-STOCK-KEY toggles stock 30 Hz pacing at runtime (104 = numpad 8)
DEV-STOCK=0
DEV-STOCK-KEY=104
; test tool: every party hit on an enemy deals this much damage: 0 = off, 9999 or 99999
DEV-DMG=0
; no running-chocobo animation when the game autosaves (the save still happens); 1 = on
QOL-SAVEICON=0
; field/map particle programs (rain, lightning, field lights, battle-entry shatter): pause flag on render-only frames
FX-010=0
; FX-010 sub-switch: spawn only on logic steps (a particle spawned on a render-only frame would be drawn before its ops initialise it)
FX-010-SPAWN=1
; FX-010 sub-switch: particle draw ops that skip their draw while paused (pyreflies, camera-facing shapes) keep drawing (no flicker)
FX-010-DRAWOPS=1
; FX-010 sub-switch: looping particles restarted at the end of a logic step are restarted at the start of the next one instead (no birth-state particles on render-only frames: pyrefly river)
FX-010-LOOPDEFER=1
; FX-010-KEYADD: draw op 0x75AF80 skips its keyed add on paused calls (Besaid ruins light shafts alternated per frame)
FX-010-KEYADD=1
; FX-010-FREEDEFER: a particle freed at the end of a logic step stays drawn on the next render-only frame and is
; freed at its program's next logic step (Zanarkand Dome great hall orbs vanished one frame per loop)
FX-010-FREEDEFER=1
; FX-010-ROLLBACK (test): paused steps of FX-010-PROGS programs leave their particle records unchanged
FX-010-ROLLBACK=0
; FX-010-EXTRAP (test): paused frames draw field particles moved FX-010-EXTRAP-PCT % of a tick ahead (smooth splashes); F3 toggles
FX-010-EXTRAP=0
FX-010-EXTRAP-PCT=50
; FX-010 test switch (bisect): pause only field program slots a-b (empty = all)
FX-010-PROGS=
; FX-010 test switch: NOP these pause-gate JNEs (hex VAs, comma-separated; the guarded blocks run while paused)
FX-010-UNGATE=
; diagnostic: log the groups and ops of the programs in FX-010-PROGS
DIAG-FX010-OPS=0
; diagnostic: diff program/particle memory across each step and phase (FX-010-PROGS programs), unpaused vs paused
DIAG-FX010-WRITES=0
; diagnostic: count draw submits inside field particle steps per caller/program, unpaused vs paused, with one call stack each
DIAG-FX010SUBMIT=0
; diagnostic: dynamic-geometry upload per invocation kind and buffer segment (empty-mesh fallbacks, segment full)
DIAG-DYNGEO=0
; diagnostic: combat lab. In battle Ctrl+LAB-001-KEY casts LAB-001-CMD (hex command id) at the next party turn through the game's
; own submit; while armed party and enemies are immortal (game debug flags) and the party acts first. Ctrl+LAB-001-OFFKEY disarms.
; keys are Windows virtual-key codes (0x61 = numpad 1, 0x63 = numpad 3; not F5, the game's hide-HUD key)
LAB-001=0
; LAB-001-CMD=0 = list mode: the key toggles a loop over the "run" lines of <game>\fps60_lab.txt (tools/lab/lab_list.py), one per party turn
LAB-001-CMD=0x3042
; LAB-001 sub-switch: log the caster actor's motion clock on each of the next N invocations after a cast (0 = off)
LAB-001-MOTCLK=0
LAB-001-KEY=0x61
LAB-001-OFFKEY=0x63
; diagnostic: log battle effect signals FUN_00788920 (arg, caller, invocation kind)
DIAG-BTLSIG=0
; DIAG-BTLSIG sub-switch: log family-X effect node transitions on every logic walk (XREC lines)
DIAG-BTLSIG-XREC=0
; diagnostic: log magic-DLL memory changed by render-only draws (finds draw-side 2x stepping); observe only
DIAG-DRAWSTEP=0
; diagnostic: write the unpacked FFX.exe code to fps60_image.bin once at start (input for tools/sigcheck.py; never commit it)
DIAG-TEXTDUMP=0
; diagnostic: when Sg_MainLoop stalls for DIAG-HANGDUMP-SEC seconds, write fps60_hang.txt (game-thread where-word,
; last loader callback, loader-lock / log-CS owners, every thread's stack) then fps60_hang.dmp; observe only.
; Stalls of 1 s or more that recover are logged. Previous non-empty reports are renamed fps60_hang_<time>.*
; The report has the game state (pause layer, esc menu, limiter, battle state and its history, magic DLL loads).
; The game's own pause (HD pause menu) is logged in one line, not reported.
DIAG-HANGDUMP=1
DIAG-HANGDUMP-SEC=10
; 1 = the minidump also holds FFX.exe's data (game state; ~30 MB, compresses well)
DIAG-HANGDUMP-DATA=1
; 1 = Ctrl+Shift+H writes the same report on request (a soft-lock keeps the game running, so the watchdog stays quiet)
DIAG-HANGDUMP-KEY=1
; frame-to-frame time histogram under 60 Hz pacing, summary every DIAG-FRAMETIME-N frames (VRR pacing check)
DIAG-FRAMETIME=0
DIAG-FRAMETIME-N=600
; 1 = Ctrl+F6 makes the game thread sleep SEC+3 s (tests the report; the game freezes for that long)
DIAG-HANGDUMP-TEST=0
; diagnostic: hardware write watch on the particle pause flag DAT_0230fd34 (who leaves it at 1); observe only
DIAG-PAUSEWATCH=0
; ---- 60 Hz promotion (smoothness, default on), re/ledger/SMOOTH.md. Master switch: 0 = no SMOOTH row scans, hooks or patches anything.
SMOOTH=1
; SMOOTH-001 (camera): logic frames draw the view half-way between the last two ticks (interpolation; field map, battle/summon camera)
SMOOTH-001=1
; SMOOTH-001 sub-switch: 1 = log counters every 600 logic frames
SMOOTH-001-DIAG=0
; SMOOTH-001 sub-switch: battle camera FOV drawn half-way with the view on logic frames (zoom and movement on the same
; frames; a large FOV jump counts as a camera cut). Mental Break shift/zoom alternation
SMOOTH-001-FOV=1
; SMOOTH-001 sub-switch: 1 = a tick step far above the previous tick's (4x, > 20 units or 10 deg) counts as a camera cut
SMOOTH-001-JUMPCUT=1
; SMOOTH-001 diagnostic: during LAB-001's cast window, log the finalize view, every view commit and camera-block changes
SMOOTH-001-CAMLOG=0
; diagnostic: F6 in the game window logs this many finalize calls - the pass of the logic period,
; the t it draws at, the view the game built and the view left for the draw, plus every commit
SMOOTH-001-TRACE=0
; SMOOTH-002 (actors): logic frames draw each actor's root (position/heading) half-way between the last two ticks (interpolation)
SMOOTH-002=1
; SMOOTH-002 sub-switch: 1 = leave actors with cloth simulation alone (if their cloth tears or lags)
SMOOTH-002-NOCLOTH=0
SMOOTH-002-DIAG=0
; warp guard: a tick that jumps > RATIO x the previous step and > MIN units is not blended (respawned NPCs)
SMOOTH-002-WARP=1
SMOOTH-002-WARP-MIN=30
SMOOTH-002-WARP-RATIO=3
; SMOOTH-002 sub-switch: 1 = zero 16 KB of stack before each Ch_DrawMain call, so logic and render-only frames read
; the same leftovers in its uninitialised stack words (save sphere ring changed brightness every frame)
SMOOTH-002-SCRUB=1
; SMOOTH-002 sub-switch: 1 (default) = attached actors (weapons, shields) follow their parent's drawn root
SMOOTH-002-CHILDREL=1
; SMOOTH-003 (limbs, 60 Hz pose): engine half-rate motion + a half step of each actor's motion on render-only frames
SMOOTH-003=1
; SMOOTH-003 sub-switches: GATES 1 = SeqFrame / Motev events only on logic steps (keep 1: battle hit timing);
; HOLD 1 = per-call face/look-at/reference-point state restored for logic; BLEND 1 = hold the pose (30 Hz) during motion blends;
; CLOTH 0 = walk cloth actors too, 1 = skip them (limbs 30 Hz), 2 = walk them but skip their model update/cloth step (test)
; SUBSTEP 1 = limb motion follows the frame rate (1/N of a tick per pass; above 60 fps this replaces the nine
; bytes of the engine's own half-step divider inside Ch_StepMotion), 0 = keep the 1/2 pair at every rate, so
; limbs animate at 60 Hz while the camera and actor roots follow the full frame rate and no game code is patched
SMOOTH-003-SUBSTEP=1
SMOOTH-003-GATES=1
SMOOTH-003-HOLD=1
SMOOTH-003-BLEND=0
SMOOTH-003-CLOTH=0
; CLOTHHOLD: cloth/hair once per logic tick for walked actors (Kimahri hair vibration): 1 = hold the sim step, 2 = skip the whole cloth job (30 Hz),
; 3 = 2 + render-only frames extrapolated half a tick, 4 = 2 + interpolated half a tick behind (smooth), 0 = off. F5 in game cycles 4/3/2/0.
SMOOTH-003-CLOTHHOLD=4
; LOOPGUARD 1 = sample render-only poses at the loop-wrapped clock (fix for twisted enemy bodies on short/hold loops);
SMOOTH-003-LOOPGUARD=1
; SMOOTH-003 sub-switch: 1 = actors in a one-frame loop (enemy hold poses) step exactly as stock (twisted-body fix)
SMOOTH-003-SHORTLOOP=1
; SMOOTH-003 sub-switch: 1 = hold the pose on a render-only frame inside the last frame of a loop (loop-end rewind fix)
SMOOTH-003-LOOPEND=1
; SMOOTH-003 sub-switch: 1 = a bone channel whose render-only sample jumps far beyond the last tick's motion keeps its tick value (twist fix; logged)
SMOOTH-003-SANITY=1
; SMOOTH-003 sub-switch: hold a whole bone at the tick pose when its two stream keys are far apart (cutscene Euler flips); replaces SANITY
SMOOTH-003-KEYHOLD=1
; SMOOTH-003 sub-switch: at the end of a motion (play-once clamp, loop end) continue bone rotations half a tick instead of repeating the pose (Tidus run stutter)
SMOOTH-003-ENDEXTRAP=1
; DIAG 1 = counters every 600 walks; 2 = also one line per unusual walked actor (loop wrap/clamp, rewind, blend, child), capped
SMOOTH-003-DIAG=0
; F7 in game toggles the SMOOTH rows on/off (installed rows only), for an A/B look

[capture]
; TRIAGE E0: FRAMEDIFF's capture inside fps60 (observe only: never touches exec or the divider).
; enabled and dll_notify are read once at game start; every other key here, regions.txt and
; allow.txt are re-read at each capture start (hotkey), so they can be edited while the game runs.
; 0 = nothing allocated or installed
enabled=0
; virtual-key code of the start/stop hotkey (0x78 = F9). Only accepted while the game window is focused.
hotkey=0x78
; scenario tag for the log name: <scenario>_observe-<boundary>_<YYYYMMDD-HHMMSS>.log
scenario=S1
; counted Sg_MainLoop invocations per capture (60 Hz pacing: 120 = 2 s)
invocations=120
; invocations before the baseline snapshot (>= 1)
warmup=2
; outer = diff around the whole fp_pre..fp_post (what the next invocation sees; rolled-back spans
;         cancel out, TRIAGE P2). inner = diff around the bare Sg_MainLoop call (after the rows'
;         pre-writes, before rollback restores: what the engine itself wrote). inner forces split_outside=1.
boundary=outer
; changed bytes closer than this are merged into one range
merge_gap=8
; budget for snapshots + hit counters (MB). FFX.exe .data alone is ~26.6 MB of snapshot.
max_total_mb=160
; 1 = also diff at the pre boundary: writes between invocations go to class OUTSIDE
split_outside=1
; 1 = also list the changed ranges of every invocation (big logs)
per_invocation_ranges=0
per_invocation_cap=64
; max range lines per class in the summary
report_cap=20000
; output folder (relative = next to FFX.exe). Copy the logs to re/captures/ afterwards.
log_dir=fps60_captures
; same syntax as FRAMEDIFF: copy src/framediff/regions.txt and allow.txt next to FFX.exe
regions=regions.txt
allow=allow.txt
; magic DLL load/unload tracking (LdrRegisterDllNotification)
dll_notify=1
