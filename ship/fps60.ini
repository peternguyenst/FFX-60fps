; fps60 - 60 fps mod for Final Fantasy X HD Remaster. Read once when the game starts.
; Most options are also in the game: main menu > Config, below the game's own rows. A change there applies at
; once and is written back to this file when you leave the Config page.
; Every setting has a built-in default; this file lists only the ones you may want to change.
; Never install next to another mod that uses dbghelp.dll.
[fps60]
; 1 = mod on, 0 = mod off
enabled=1
; 1 = the mod's frame rate below, 0 = original 30 fps
pacing=1
; frames per second: any multiple of 30 from 60 to 240 (60, 90, 120, 150, 180, 210, 240). The game itself
; still runs at its original speed; this is how many frames are drawn. For anything above 60, turn V-Sync off
; in the game's Config page - with V-Sync on, the game cannot draw faster than the monitor refreshes. If the
; PC cannot hold the rate, the mod steps down one notch at a time and tries again later, so it settles on the
; highest rate your machine actually holds.
fps=60
; soft reset to the title screen: hold these buttons together (field only, not in battle); 0 = off
; buttons: L1 L2 R1 R2 L3 R3 START SELECT TRIANGLE CIRCLE CROSS SQUARE UP DOWN LEFT RIGHT, joined by +
soft_reset=L1+L2+R1+R2+START+SELECT

[rows]
; smooth camera and character motion between game ticks (F7 toggles in game); 0 = off
SMOOTH=1
; hold a key to fast-forward; key = Windows virtual-key code in decimal (96 = numpad 0, 112 = F1); speed 2..30
DEV-TURBO=1
DEV-TURBO-KEY=96
DEV-TURBO-SPEED=10
; when the PC cannot hold the frame rate, step down for a while (game speed stays right); 0 = off
PERF-002=1

; gameplay options (off by default)
; every party member has the Sensor effect (enemy HP and info when targeting), no armor needed; 1 = on
QOL-SENSOR=0
; every party member earns AP after a battle, also those who did not fight; 1 = on
QOL-AP=0
; with QOL-AP: 1 = members KO'd at the end earn AP too, 0 = only members alive at the end
QOL-AP-KO=1
; with QOL-AP: AP for members who did not fight, in percent of a fighter's (100 = same, 50 = half)
QOL-AP-RATE=100
; after a party wipe, ask "Retry / Give up"; Retry restarts the battle as it began; 1 = on
QOL-RETRY=0
; with QOL-RETRY: 1 = the soft-reset chord in battle shows the prompt too, 0 = the chord goes straight to the title
QOL-RETRY-CHORD=1
; no running-chocobo animation when the game autosaves (the save still happens); 1 = on
QOL-SAVEICON=0
; voiced cutscenes play at the original 30 fps so the voice and lips stay in sync; 0 = off
CLK-013=1
